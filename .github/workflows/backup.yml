name: Encrypted production backup
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.ENABLE_SCHEDULED_BACKUP == 'true'
    environment: backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm run backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      - name: Verify every snapshot
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          for snapshot in .backups/*; do
            node scripts/verify-backup.mjs "$snapshot"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-rh-backup-${{ github.run_id }}
          path: .backups/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
